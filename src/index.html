<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Language Media Viewer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="top-bar">
    <h1>Language Media Viewer</h1>
    <div class="top-actions">
      <a href="sentence.html">
        <button type="button">Sentence Book</button>
      </a>
      <a href="editor.html">
        <button type="button">Open Editor</button>
      </a>
    </div>
  </div>

  <div class="row">
    <div class="sidebar panel">
      <h3>Lessons</h3>

      <div class="library-toolbar">
        <select id="lessonFolderSelect">
          <option value="">(root)</option>
        </select>
      </div>

      <ul id="lessonList"></ul>
    </div>

    <div class="main panel">
      <div class="viewer-header">
        <div>
          <h2 id="lessonTitle">Select a lesson</h2>
          <div id="lessonMeta" class="clip-meta"></div>
        </div>
        <a id="editCurrentLessonLink" class="hidden" href="editor.html">
          <button type="button">Edit This Lesson</button>
        </a>
      </div>

      <video id="player" controls width="700"></video>

      <div class="clip-list-header">
        <h3>Clip List</h3>
        <label class="clip-page-size">
          Per page
          <select id="clipPageSize">
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="50">50</option>
          </select>
        </label>
      </div>
      <ul id="clipList"></ul>
      <div id="clipPagination" class="clip-pagination"></div>
    </div>
  </div>

  <div id="appMessage" class="app-message hidden"></div>

  <script src="viewer.js"></script>
</body>
</html>
