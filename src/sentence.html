<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Sentence Book</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Sentence Book</h1>

  <div class="panel" style="margin-bottom:16px;">
    <div style="display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:center;">
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <input id="sentenceSearchInput" placeholder="Search sentence / translation / category" style="min-width:280px;" />
        <select id="sentenceCategoryFilter" style="min-width:220px;">
          <option value="">All categories</option>
        </select>
        <button id="sentenceSearchBtn">Search</button>
        <button id="sentenceClearBtn">Clear</button>
      </div>

      <div>
        <button id="openSentenceExportBtn" type="button">Export</button>
        <a href="index.html">
          <button type="button">Back to Editor</button>
        </a>
      </div>
    </div>
  </div>

  <div class="panel" style="margin-bottom:16px;">
    <audio id="sentencePlayer" controls style="width:100%; margin-bottom:16px;"></audio>

    <div id="sentenceEditorPanel" style="display:none; border:1px solid #ddd; padding:12px; border-radius:8px; margin-bottom:16px;">
      <h3 style="margin-top:0;">Edit Sentence</h3>

      <input type="hidden" id="editSentenceId" />

      <div style="margin-bottom:10px;">
        <label for="editSentenceJp">Japanese</label><br>
        <textarea id="editSentenceJp" rows="3" style="width:100%;"></textarea>
      </div>

      <div style="margin-bottom:10px;">
        <label for="editSentenceZh">Chinese</label><br>
        <textarea id="editSentenceZh" rows="3" style="width:100%;"></textarea>
      </div>

      <div style="margin-bottom:10px;">
        <label for="editSentenceCategory">Category</label><br>
        <input id="editSentenceCategory" style="width:100%;" />
      </div>

      <div style="margin-bottom:10px;">
        <label for="editSentenceNote">Note</label><br>
        <textarea id="editSentenceNote" rows="2" style="width:100%;"></textarea>
      </div>

      <div style="display:flex; gap:8px;">
        <button id="saveSentenceEditBtn" type="button">Save Changes</button>
        <button id="cancelSentenceEditBtn" type="button">Cancel</button>
      </div>
    </div>

    <div class="sentence-list-header">
      <h3>Sentence List</h3>
      <label class="clip-page-size">
        Per page
        <select id="sentencePageSize">
          <option value="10">10</option>
          <option value="20">20</option>
          <option value="50">50</option>
        </select>
      </label>
    </div>
    <ul id="sentenceList"></ul>
    <div id="sentencePagination" class="clip-pagination"></div>
  </div>

  <div id="sentenceExportModal" class="modal hidden">
    <div class="modal-content export-modal-content">
      <h3>Export Sentences</h3>

      <input id="sentenceExportTitle" placeholder="Export title" style="width:100%; margin-bottom:12px;" />

      <div class="export-picker">
        <div class="export-column">
          <div class="export-search-row">
            <input id="sentenceExportSearchInput" placeholder="Search sentences" />
            <select id="sentenceExportCategoryFilter">
              <option value="">All categories</option>
            </select>
            <button id="sentenceExportSearchBtn" type="button">Search</button>
          </div>
          <div id="sentenceExportAvailableList" class="export-list"></div>
        </div>

        <div class="export-column">
          <div class="export-selected-header">
            <strong>Selected</strong>
            <span id="sentenceExportSelectedCount">0</span>
          </div>
          <div id="sentenceExportSelectedList" class="export-list"></div>
        </div>
      </div>

      <div class="modal-actions">
        <button id="sentenceExportDownloadBtn" type="button">Export ZIP</button>
        <button id="sentenceExportCancelBtn" type="button">Cancel</button>
      </div>
    </div>
  </div>

  <script src="sentence.js"></script>
</body>
</html>
