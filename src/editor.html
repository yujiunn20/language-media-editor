<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title data-i18n="app.editorTitle">Lesson Editor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="top-bar">
      <h1 data-i18n="app.editorTitle">Lesson Editor</h1>
      <div class="top-actions">
      <label>
        <span data-i18n="common.language">UI language</span>
        <select data-language-select>
          <option value="en">English</option>
          <option value="zh">中文</option>
          <option value="ja">日本語</option>
        </select>
      </label>
      <a href="index.html">
        <button type="button" data-i18n="nav.backToViewer">Back to Viewer</button>
      </a>
      <a href="sentence.html">
        <button type="button" data-i18n="nav.sentenceBook">Sentence Book</button>
      </a>
    </div>
  </div>

  <div class="row">
    <div class="sidebar panel">
      <h3 data-i18n="library.media">Media Library</h3>

      <div class="library-toolbar">
        <select id="mediaFolderSelect">
          <option value="" data-i18n="common.root">(root)</option>
        </select>

        <div class="library-button-grid">
          <button id="newMediaFolderBtn" data-i18n="library.newFolder">New Folder</button>
          <button id="renameMediaFolderBtn" data-i18n="library.renameFolder">Rename Folder</button>
          <button id="moveMediaFolderBtn" data-i18n="library.moveFolder">Move Folder</button>
          <button id="deleteMediaFolderBtn" data-i18n="library.deleteFolder">Delete Folder</button>
          <button id="importMediaBtn" data-i18n="library.importMedia">Import Media</button>
        </div>
      </div>

      <ul id="mediaList"></ul>

      <h3 data-i18n="library.lessonLibrary">Lesson Library</h3>

      <div class="library-toolbar">
        <select id="lessonFolderSelect">
          <option value="" data-i18n="common.root">(root)</option>
        </select>

        <div class="library-button-grid">
          <button id="newLessonFolderBtn" data-i18n="library.newFolder">New Folder</button>
          <button id="renameLessonFolderBtn" data-i18n="library.renameFolder">Rename Folder</button>
          <button id="moveLessonFolderBtn" data-i18n="library.moveFolder">Move Folder</button>
          <button id="deleteLessonFolderBtn" data-i18n="library.deleteFolder">Delete Folder</button>
          <button id="importLessonBtn" data-i18n="library.importLesson">Import Lesson</button>
          <button id="importLessonExportBtn" data-i18n="library.importLessonZip">Import Lesson ZIP</button>
        </div>
      </div>

      <ul id="lessonList"></ul>
    </div>

    <div class="main panel">
      <video id="player" controls width="700"></video>

      <div style="margin-top:12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
        <button id="setStart" data-i18n="editor.setStart">Set Start</button>

        <span class="label" id="jumpStart" style="cursor:pointer; text-decoration:underline;" data-i18n="editor.start">Start</span>
        <input id="startTime" type="number" step="0.1" value="0" style="width:90px;" />

        <button id="setEnd" style="margin-left:12px;" data-i18n="editor.setEnd">Set End</button>

        <span class="label" id="jumpEnd" style="cursor:pointer; text-decoration:underline;" data-i18n="editor.end">End</span>
        <input id="endTime" type="number" step="0.1" value="0" style="width:90px;" />
      </div>

      <div style="margin-top:12px;">
        <input id="lessonTitle" placeholder="Lesson title" data-i18n-placeholder="lesson.titlePlaceholder" />
        <textarea id="jpText" placeholder="Source sentence" data-i18n-placeholder="common.sourceSentence"></textarea>
        <textarea id="zhText" placeholder="Translation" data-i18n-placeholder="common.translation"></textarea>
        <input id="category" placeholder="Category" data-i18n-placeholder="common.category" />
        <div class="transcribe-row">
          <label for="transcribeLanguage" data-i18n="editor.transcribeLanguage">Transcribe language</label>
          <select id="transcribeLanguage">
            <option value="auto" data-i18n="editor.autoDetect">Auto detect</option>
            <option value="ja" selected>Japanese</option>
            <option value="en">English</option>
            <option value="zh">Chinese</option>
            <option value="ko">Korean</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="es">Spanish</option>
            <option value="it">Italian</option>
            <option value="pt">Portuguese</option>
            <option value="ru">Russian</option>
            <option value="vi">Vietnamese</option>
            <option value="th">Thai</option>
            <option value="id">Indonesian</option>
            <option value="ms">Malay</option>
            <option value="ar">Arabic</option>
            <option value="hi">Hindi</option>
          </select>
        </div>
        <div>
          <button id="transcribeClipBtn" data-i18n="editor.autoTranscribe">Auto Transcribe</button>
          <button id="playEditorClipBtn" data-i18n="editor.playCurrentClip">Play Current Clip</button>
          <button id="addClip" data-i18n="editor.addClip">Add Clip</button>
          <button id="deleteClipBtn" style="display:none;" data-i18n="editor.deleteClip">Delete Clip</button>
          <button id="cancelEditBtn" style="display:none;" data-i18n="editor.cancelEdit">Cancel Edit</button>
          <button id="saveLesson" data-i18n="editor.saveLesson">Save Lesson</button>
        </div>
        <div id="editorModeLabel" style="margin-top:6px; color:#666;"></div>
      </div>

      <div class="clip-list-header">
        <h3 data-i18n="lesson.clipList">Clip List</h3>
        <label class="clip-page-size">
          <span data-i18n="common.perPage">Per page</span>
          <select id="clipPageSize">
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="50">50</option>
          </select>
        </label>
      </div>
      <ul id="clipList"></ul>
      <div id="clipPagination" class="clip-pagination"></div>
    </div>
  </div>

  <div id="appMessage" class="app-message hidden"></div>

  <div id="saveSentenceModal" class="modal hidden">
    <div class="modal-content save-sentence-modal-content">
      <h3 data-i18n="sentence.saveSentence">Save Sentence</h3>

      <label class="field-label" for="saveSentenceJp" data-i18n="common.sourceSentence">Source sentence</label>
      <textarea id="saveSentenceJp"></textarea>

      <label class="field-label" for="saveSentenceZh" data-i18n="common.translation">Translation</label>
      <textarea id="saveSentenceZh"></textarea>

      <label class="field-label" for="saveSentenceCategory" data-i18n="common.category">Category</label>
      <input id="saveSentenceCategory" />

      <label class="field-label" for="saveSentenceNote" data-i18n="common.note">Note</label>
      <textarea id="saveSentenceNote"></textarea>

      <div id="saveSentenceStatus" class="modal-status"></div>

      <div class="modal-actions">
        <button id="saveSentenceConfirmBtn" data-i18n="common.save">Save</button>
        <button id="saveSentenceCancelBtn" data-i18n="common.cancel">Cancel</button>
      </div>
    </div>
  </div>

  <div id="moveModal" class="modal hidden">
    <div class="modal-content">
      <h3 data-i18n="common.moveToFolder">Move to folder</h3>

      <div id="moveFolderList" class="folder-list"></div>

      <div class="modal-actions">
        <button id="moveConfirmBtn" data-i18n="common.confirm">Confirm</button>
        <button id="moveCancelBtn" data-i18n="common.cancel">Cancel</button>
      </div>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
