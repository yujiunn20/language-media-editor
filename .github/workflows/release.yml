name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync package version with tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      - name: Prepare Whisper CLI and model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/whisper/models
          curl -L --retry 3 -o tools/whisper/models/ggml-base.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git .whisper-src
          cmake -S .whisper-src -B .whisper-build -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build .whisper-build --config Release --target whisper-cli
          if [ "${RUNNER_OS}" = "Windows" ]; then
            cp .whisper-build/bin/Release/whisper-cli.exe tools/whisper/whisper-cli.exe
            find .whisper-build/bin/Release -maxdepth 1 -name '*.dll' -exec cp {} tools/whisper/ \;
          else
            cp .whisper-build/bin/whisper-cli tools/whisper/whisper-cli
            chmod +x tools/whisper/whisper-cli
          fi

      - name: Build Windows app
        if: runner.os == 'Windows'
        run: npm run dist:win

      - name: Build Linux app
        if: runner.os == 'Linux'
        run: npm run dist:linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: language-media-editor-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/*.yml
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
